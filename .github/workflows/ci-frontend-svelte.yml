name: CI (Svelte frontend)

# Kept separate from ci.yml on purpose: frontend-svelte/ is developed on a
# long-lived branch alongside the React frontend, and a separate file avoids
# repeatedly conflicting with main. Fold these jobs into ci.yml once the React
# frontend is retired.
on:
  push:
    branches:
      - main
    paths: &paths
      - "frontend-svelte/**"
      - ".github/workflows/ci-frontend-svelte.yml"
  pull_request:
    paths: *paths

# Both jobs only read the repository. Without this the GITHUB_TOKEN inherits the
# repository default, which can be write-all — flagged by CodeQL as
# "Workflow does not contain permissions".
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend-svelte

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend-svelte/bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Build
        run: bun run build

  test:
    runs-on: ubuntu-latest
    # Sessions live in Redis, and the e2e suite signs in for real against the
    # stand-in backend in e2e/mock-api.ts, so both tiers need a running server.
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend-svelte/bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Component tests run in a real Chromium via vitest browser mode, so the
      # browser is needed for the unit job too, not only for e2e.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend-svelte/bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Unit and component tests
        run: bun run test:unit --run
      # Called directly rather than through `bun run test:e2e`, which would
      # re-run the browser install done above.
      - name: End-to-end tests
        run: bunx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-svelte/playwright-report/
          retention-days: 7
