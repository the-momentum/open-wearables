inheritance: true

reviews:
  auto_apply_labels: true
  labeling_instructions:
    - label: breaking-change
      instructions: >-
        Apply when the PR breaks an existing self-hosted instance or its clients after upgrading,
        as defined in the "Breaking changes called out" pre-merge check.
    - label: backend
      instructions: Apply when the PR changes files under backend/.
    - label: frontend
      instructions: Apply when the PR changes files under frontend/.
    - label: documentation
      instructions: Apply when the PR changes files under docs/ or other user-facing documentation.
    - label: MCP
      instructions: Apply when the PR changes files under mcp/ or docs/mcp-server/.
    - label: public-api
      instructions: >-
        Apply when the PR changes endpoints or schemas of routers tagged "External: ..." in
        backend/app/api/routes/v1/__init__.py.
    - label: mobile-sdk
      instructions: >-
        Apply when the PR changes the backend endpoints or payloads used by the mobile SDKs
        (routers tagged "External: Mobile SDK") or SDK documentation.
    - label: webhooks
      instructions: Apply when the PR changes outgoing webhooks or incoming provider webhook handling.
    - label: data model
      instructions: Apply when the PR changes SQLAlchemy models under backend/app/models/ or adds migrations.
    - label: health-scores
      instructions: >-
        Apply when the PR changes health score calculation or storage (sleep score, stress, etc.),
        e.g. backend/app/services/scores/ or backend/app/services/health_score_service.py.
    - label: women's health
      instructions: Apply when the PR changes menstrual cycle or other women's health data.
    - label: fit-files
      instructions: Apply when the PR changes FIT file parsing or import.
    - label: infra
      instructions: Apply when the PR changes Docker, docker-compose, deployment files or .github/workflows/.
    - label: security
      instructions: Apply when the PR changes authentication, authorization, API keys, tokens or secrets handling.
    - label: performance
      instructions: Apply when the main goal of the PR is to make something faster or use fewer resources.
    - label: refactor
      instructions: Apply when the PR restructures code without changing behavior.
    - label: apple health
      instructions: Apply when the PR changes the Apple Health integration (backend/app/services/providers/apple/).
    - label: samsung health
      instructions: Apply when the PR changes the Samsung Health integration (backend/app/services/providers/samsung/).
    - label: google health connect
      instructions: Apply when the PR changes the Health Connect integration (backend/app/services/providers/health_connect/).
    - label: Google Health API
      instructions: >-
        Apply when the PR changes the Google Health API integration
        (backend/app/services/providers/google/ or backend/app/services/providers/google_health/).
    - label: garmin
      instructions: Apply when the PR changes the Garmin integration (backend/app/services/providers/garmin/).
    - label: polar
      instructions: Apply when the PR changes the Polar integration (backend/app/services/providers/polar/).
    - label: suunto
      instructions: Apply when the PR changes the Suunto integration (backend/app/services/providers/suunto/).
    - label: whoop
      instructions: Apply when the PR changes the Whoop integration (backend/app/services/providers/whoop/).
    - label: strava
      instructions: Apply when the PR changes the Strava integration (backend/app/services/providers/strava/).
    - label: oura
      instructions: Apply when the PR changes the Oura integration (backend/app/services/providers/oura/).
    - label: fitbit
      instructions: Apply when the PR changes the Fitbit integration (backend/app/services/providers/fitbit/).
    - label: ultrahuman
      instructions: Apply when the PR changes the Ultrahuman integration (backend/app/services/providers/ultrahuman/).
    - label: sensorbio
      instructions: Apply when the PR changes the Sensorbio integration (backend/app/services/providers/sensorbio/).
    - label: withings
      instructions: Apply when the PR changes the Withings integration (backend/app/services/providers/withings/).

  pre_merge_checks:
    custom_checks:
      - name: "Breaking changes called out"
        mode: warning
        instructions: |
          Pass if the PR has no breaking change, or if every breaking change
          is stated explicitly in the PR description: what breaks, who is
          affected and the upgrade steps. Fail otherwise.

          A breaking change is a change that breaks an existing self-hosted
          instance or its clients after upgrading: removed or renamed
          endpoints, fields, query params or enum values in routers tagged
          "External: ..." in backend/app/api/routes/v1/__init__.py or in their
          schemas; changed types, units, semantics or status codes there; new
          required request fields; changed auth behavior; mobile SDK payloads
          that are no longer accepted; changed outgoing webhook event types or
          payloads; changed provider webhook or OAuth callback paths; renamed
          or removed env vars or changed defaults; renamed services, ports,
          volumes or entrypoints in deploy files; destructive or
          non-reversible migrations. Changes to "Internal: ..." routers with
          frontend/ updated in the same PR, and Celery task renames, are not
          breaking changes.

  path_instructions:
    - path: "**"
      instructions: |
        Flag a missing docs/ update only when the PR changes something an
        integrator or operator can see or has to act on: public API requests or
        responses, webhook payloads or delivery, which data a provider returns
        (coverage, new series or fields), settings or env vars, deployment or
        upgrade steps. Suggest the specific doc file. Do not ask for docs for
        internal mechanisms: token handling, provider registration or
        deregistration internals, database tables or migrations that don't
        change the API, Redis keys, background task internals, or bug fixes
        that restore already-expected behavior. Flag
        docs/architecture/unified-data-model.mdx only when a changed table
        already appears in it. The API reference under docs/api-reference/ is
        generated by Mintlify from the live openapi.json, so endpoint changes
        alone do not require a docs/api-reference/ edit.

    - path: "**"
      instructions: |
        Open Wearables is self-hosted. Many independent instances run different
        versions and upgrade on their own schedule, and their API clients,
        mobile SDK builds, webhook consumers and configs are outside our
        control. Treat backward compatibility as the default. Flag any change
        that would break an existing deployment or its clients after
        upgrading, including: removed or renamed endpoints, fields, query
        params or enum values; changed types, units, semantics or status
        codes; new required request fields; changed auth behavior; renamed or
        removed env vars or changed defaults; destructive or non-reversible
        migrations. Suggest a compatible alternative where possible (keep the
        old field, path or env var as a deprecated alias, make new fields
        optional, add instead of replace).

    - path: "backend/app/api/**"
      instructions: |
        Operation pages in docs/api-reference/ are generated from openapi.json,
        so do not ask for a docs/api-reference/ edit just because an endpoint
        was added, modified, or removed. Only flag when hand-written docs
        (docs/api-reference/guides/**, docs/api-reference/introduction.mdx,
        or other pages under docs/) reference the changed endpoint by path,
        example, or response shape and would now be wrong.

    - path: "backend/app/api/**"
      instructions: |
        Route decorators set status_code only when the success response is
        not 200 (201, 202, 204). FastAPI defaults to 200, so do not flag a
        missing status_code on routes that return 200 and do not suggest
        adding status_code=status.HTTP_200_OK.

    - path: "backend/app/services/providers/**"
      instructions: |
        If a new provider is added or an existing provider's data mapping
        changes, verify that docs/providers/ pages are updated accordingly.
        Check coverage tables and supported data types.

    - path: "backend/app/services/providers/**"
      instructions: |
        If data normalization, mapping, or calculation logic changes: flag
        that existing records in the database will NOT be affected. Require
        the PR to state whether a data migration or backfill is needed for
        historical records, or explicitly note that only new data is affected.

    - path: "backend/app/config.py"
      instructions: |
        If settings fields are added, removed, or renamed, or their defaults
        change, verify that backend/config/.env.example is updated to match.
        New optional settings may be added commented-out with their default
        value. Flag any drift between the two files.

    - path: "backend/app/api/**"
      instructions: |
        Routers are grouped and tagged in routes/v1/__init__.py. Routers
        tagged "External: ..." are the public API used by external clients
        and SDKs: a removed or renamed route, param or response field, or a
        changed response shape, is a breaking change - apply the
        backward-compatibility rules. Routers tagged "Internal: ..." serve
        only the dashboard in frontend/, which ships with the backend, so
        do not flag breaking changes there as long as frontend/ is updated
        in the same PR.

    - path: "backend/app/api/routes/v1/{webhooks,deprecated_webhooks,oura_webhooks,strava_webhooks,oauth}.py"
      instructions: |
        Incoming webhook and OAuth callback URLs are registered by hand in
        each provider's developer portal, separately on every instance.
        Changing a path silently stops data or breaks login. Keep the old
        path working, following the pattern in deprecated_webhooks.py.

    - path: "backend/app/schemas/**"
      instructions: |
        Schemas used by "External: ..." routers (see routes/v1/__init__.py)
        or by the mobile SDK define the public contract. Removing,
        renaming or narrowing the type of a field, or making a field
        required, is breaking. New response fields should be additive and
        new request fields optional.

    - path: "backend/app/{schemas/providers/mobile_sdk/**,api/routes/v1/sdk_sync.py}"
      instructions: |
        Mobile apps built with older SDK versions stay on users' phones for
        months. The backend must keep accepting old payload formats: new
        fields must be optional, and an unknown enum value or data type must
        not fail validation for the whole payload.

    - path: "backend/app/{services/outgoing_webhooks,constants/webhooks,schemas/webhooks}/**"
      instructions: |
        Outgoing webhook payloads are a contract with customers' endpoints.
        Renaming or removing an event type, or removing, renaming or
        changing the type of a payload field, is a breaking change.

    - path: "backend/app/integrations/celery/tasks/**"
      instructions: |
        Tasks already queued in Redis during an upgrade (backlog, countdown
        tasks, retries) are picked up by the new worker. A changed task name
        makes the worker drop them as unregistered, and a changed signature
        (removed or renamed args, new required args) makes them fail. Point
        this out and suggest the safe variant: keep the old name registered
        as an alias, give new args defaults. This is an upgrade hazard, not
        a breaking change - do not require a breaking change note in the PR
        description for it.

    - path: "backend/migrations/**"
      instructions: |
        Instances upgrade with existing data. Flag dropped or renamed columns
        or tables, NOT NULL added without a default or backfill, and a
        missing or empty downgrade().

    - path: "backend/scripts/data_migrations/**"
      instructions: |
        Every instance runs these against its own data. They must be
        idempotent and safe to run more than once.

    - path: "{mcp/app/config.py,mcp/config/.env.example,frontend/.env.example}"
      instructions: |
        Renaming or removing an env var, or changing its default, breaks
        existing .env files on running instances. Prefer keeping the old
        name as a fallback alias, otherwise treat it as a breaking change.
        Keep .env.example in sync with the settings.

    - path: "{docker-compose.yml,**/Dockerfile,backend/scripts/start/**}"
      instructions: |
        Self-hosters deploy from these files, often with their own
        overrides, and Railway template deployments depend on env var
        names. Flag renamed services, changed ports, volumes or entrypoints,
        and renamed env vars as breaking changes.

    - path: "backend/app/schemas/**"
      instructions: |
        If data models or enums change (e.g. new provider, new data type),
        check if docs/architecture/unified-data-model.mdx and related pages
        reflect these changes.

    - path: "docs/**"
      instructions: |
        Verify documentation accuracy against the actual code in this PR.
        Ensure code examples are correct and API references match current endpoints.
